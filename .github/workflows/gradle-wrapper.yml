name: Generate Gradle wrapper (one-time)

# يولّد ملفات gradlew وgradle/wrapper ويضيفها للمستودع (مطلوبة لـJitPack ولمن يفتح المشروع في Android Studio).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Generate wrapper
        working-directory: packages/core-android
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin
      - name: Commit wrapper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/core-android/gradlew packages/core-android/gradlew.bat packages/core-android/gradle
          git commit -m "chore: add Gradle wrapper" || echo "لا تغييرات"
          git push
