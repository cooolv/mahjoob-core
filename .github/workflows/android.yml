name: Android

on:
  push:
    branches: [main]
    paths:
      - "packages/core-android/**"
      - "spec/**"
      - ".github/workflows/android.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Unit tests (JVM) and AAR
        run: gradle :mahjoob-android:testDebugUnitTest :mahjoob-android:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: mahjoob-android-aar
          path: packages/core-android/mahjoob-android/build/outputs/aar/*.aar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: packages/core-android/mahjoob-android/build/reports/tests
