name: Android release (AAR)

# لإصدار نسخة: أنشئ وسمًا مثل android-v0.1.0 (git tag android-v0.1.0 && git push --tags)
on:
  push:
    tags: ["android-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Version from tag
        run: echo "VER=${GITHUB_REF_NAME#android-v}" >> "$GITHUB_ENV"
      - name: Test and build AAR
        run: gradle -PreleaseVersion="$VER" :mahjoob-android:testDebugUnitTest :mahjoob-android:assembleRelease --stacktrace
      - name: Name the AAR
        run: cp mahjoob-android/build/outputs/aar/mahjoob-android-release.aar "mahjoob-android-$VER.aar"
      - uses: softprops/action-gh-release@v2
        with:
          files: packages/core-android/mahjoob-android-${{ env.VER }}.aar
          generate_release_notes: true
